<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 1100" width="780" height="1100">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="780" height="1100" fill="#ffffff"/>

  <text x="390" y="28" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="bold" fill="#111827">Метод имитации отжига</text>

  <!-- Начало -->
  <rect x="310" y="46" width="160" height="40" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="390" y="71" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Начало</text>

  <!-- Ввод -->
  <polygon points="200,106 600,106 580,162 180,162" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="128" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Ввод: задача, T₀, скорость охлаждения α,</text>
  <text x="390" y="148" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">число итераций, T_min, seed</text>

  <!-- Текущее решение -->
  <rect x="190" y="184" width="400" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="390" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Текущее решение := случайный</text>
  <text x="390" y="228" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">вектор x из [0, 1]ⁿ</text>

  <!-- F_cur -->
  <rect x="190" y="256" width="400" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="390" y="284" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">F_cur := F(x); x_best := x; F_best := F_cur</text>

  <!-- T := T0 -->
  <rect x="310" y="320" width="160" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="390" y="343" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">T := T₀; k := 0</text>

  <!-- Условие цикла -->
  <polygon points="390,354 520,387 390,420 260,387" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="382" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">k &lt; итераций</text>
  <text x="390" y="400" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">и T &gt; T_min ?</text>

  <!-- Сосед -->
  <rect x="190" y="452" width="400" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="390" y="476" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Сформировать соседнее решение:</text>
  <text x="390" y="496" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">случайное изменение одного гена</text>

  <!-- Оценка соседа -->
  <rect x="190" y="528" width="400" height="52" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="390" y="552" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Оценить соседа: F_new := F(x_сос),</text>
  <text x="390" y="572" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Δ := F_new − F_cur</text>

  <!-- Критерий Метрополиса -->
  <polygon points="390,600 525,635 390,670 255,635" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="630" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Δ ≥ 0 или</text>
  <text x="390" y="648" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">rand &lt; exp(Δ/T) ?</text>

  <!-- Принять соседа -->
  <rect x="190" y="696" width="400" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="390" y="724" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">x := x_сос; F_cur := F_new</text>

  <!-- Улучшение best? -->
  <polygon points="390,757 512,788 390,819 268,788" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="390" y="794" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">F_new &gt; F_best ?</text>

  <!-- Обновить best -->
  <rect x="190" y="844" width="400" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="390" y="872" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">x_best := x_сос; F_best := F_new</text>

  <!-- Охлаждение -->
  <rect x="190" y="912" width="400" height="44" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" rx="4"/>
  <text x="390" y="940" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">k := k + 1; T := α·T; F_best → история</text>

  <!-- Вывод -->
  <polygon points="200,986 600,986 580,1040 180,1040" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="390" y="1008" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Вывод: x_best, F_best,</text>
  <text x="390" y="1028" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">история сходимости</text>

  <!-- Конец -->
  <rect x="310" y="1052" width="160" height="40" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="390" y="1077" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#111827">Конец</text>

  <!-- Стрелки -->
  <line x1="390" y1="86" x2="390" y2="104" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="162" x2="390" y2="182" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="236" x2="390" y2="254" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="300" x2="390" y2="318" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- да: в цикл -->
  <line x1="390" y1="420" x2="390" y2="450" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="408" y="440" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-style="italic" fill="#15803d">да</text>
  <line x1="390" y1="504" x2="390" y2="526" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="580" x2="390" y2="598" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- да: принять -->
  <line x1="390" y1="670" x2="390" y2="694" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="408" y="686" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-style="italic" fill="#15803d">да</text>
  <!-- нет: сразу к охлаждению -->
  <polyline points="525,635 620,635 620,934 592,934" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="533" y="627" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-style="italic" fill="#b91c1c">нет</text>
  <line x1="390" y1="740" x2="390" y2="755" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- да: обновить best -->
  <line x1="390" y1="819" x2="390" y2="842" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="408" y="834" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-style="italic" fill="#15803d">да</text>
  <!-- нет: к охлаждению -->
  <polyline points="268,788 160,788 160,934 188,934" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="172" y="780" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-style="italic" fill="#b91c1c">нет</text>
  <line x1="390" y1="888" x2="390" y2="910" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- возврат к условию цикла -->
  <polyline points="590,934 670,934 670,387 522,387" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- нет: условие цикла -> вывод -->
  <polyline points="520,387 700,387 700,1013 594,1013" fill="none" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="528" y="379" font-family="Segoe UI, Arial, sans-serif" font-size="13" font-style="italic" fill="#b91c1c">нет</text>
  <line x1="390" y1="1040" x2="390" y2="1050" stroke="#374151" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>
